(function () {
  var D = window.DEMO || {}
  /* 1) Si el celular no deja guardar datos (pasa con algunos archivos abiertos desde WhatsApp o Descargas), se usa una memoria temporal: la demo funciona igual */
  function memoria() {
    var o = {}, def = function (n, f) { Object.defineProperty(o, n, { value: f, enumerable: false }) }
    def('getItem', function (k) { return Object.prototype.hasOwnProperty.call(o, k) ? o[k] : null })

  try {

/* Edición de la carta: si la última vez se vio una edición (Navidad, Halloween…), la bienvenida ya sale con sus colores.

/* ¿Está en su horario la programación de «Noche en la terraza»? (copia corta de enHorario() de src/compartido/ediciones.js; el código de verdad lo confirma al cargar) */
function enHorarioNoche(p, d) {
  function hm(t) { var m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null }

lo y el mensaje, pone su propia portada (foto o video), apaga platos solo para esa edición, agrega platos exclusivos (ej: Combo Halloween) y programa cuándo se prende sola: por días y horario (Almuerzos, lunes a viernes de 12 a 3) o por fechas (Halloween, del 25 al 31 de octubre). Con «Ver cómo queda» la mira antes de activarla.`,`ediciones`],[`.ed-noche`,`Ambiente de la carta Normal`,`Debajo de la edición «Normal» está su ambiente animado, «Noche en la terraza»: desde las 6 p.m. la carta pasa a una paleta oscura y cálida, con guirnaldas de bombillos, luciérnagas, vapor en los platos calientes y un resplandor en las tarjetas; de día vuelve a los colores de Apariencia. Escoja la intensidad (Apagado, Suave, Media o Fuerte) y deje prendido «Ambiente de noche automático desde las 6 p.m.». «Ver de noche» le deja verlo ahora mismo.`,`ediciones`],[`.a-colores`,`Colores de la carta`,`Cambie los colores de la carta Normal: fondo, tarjetas, color principal (botones y barra de categorías), acento (precios y detalles) y texto. Escoja una paleta ya armada con un toque, o cada color con el selector. Abajo ve la carta en miniatura antes de guardar. Si con esos colores algo no se lee bien, se lo avisa y no deja guardar. «Volver a los colores originales» deja los de siempre. Las ediciones de temporada siguen con sus propios colores.`,`apariencia`],[`.a-imgs`,`Imágenes de la carta`,`Aquí están todas las imágenes que NO son de comida: el logo (acepta PNG con fondo transparente), la foto de la portada, y el fondo de la animación de bienvenida (la foto de «Arma tu pizza» está en Platos → Pizzas y las de cada categoría en la pestaña Categorías). Cada una con vista previa, «Cambiar» y «Volver a la original». Se reducen de tamaño solas antes de guardarse.`,`apariencia`],[`.a-mesas`,`Mesas`,`Ponga un nombre a una mesa (ej: Terraza), desactívela o agregue una nueva. El QR de cada mesa es fijo: no cambia nunca.`,`mesas`],[`.a-qr-todos`,`Los QR de las mesas`,`«Ver QR» (en cada mesa) muestra su QR: puede descargarlo como imagen o imprimirlo. «Imprimir todos los QR» abre hojas tamaño carta con 6 QR cada una, el logo, «Mesa X» y líneas para recortar. El QR de cada mesa es siempre el mismo y usa la dirección de este sitio.`,`mesas`],[`.a-cats`,`Categorías`,`Aquí cambia el nombre de una categoría o crea una nueva, por ejemplo Desayunos, con su foto de portada.`,`categorias`],[`.a-cv`,`Isla y portada: foto o video`,`Cada categoría tiene dos recuadros: la isla (la tarjeta del inicio) y la portada (arriba al entrar). En cada uno escoja Foto o Video con el selector, suba el archivo y vea la vista previa. El video (de 5 a 10 segundos, sin sonido, menos de 15 MB) reemplaza a la foto; una foto nueva reemplaza al video. «Quitar» vuelve a lo de antes.`,`categorias`],[`.a-personal`,`Personal`,`Aquí están las cuentas de los meseros. «Agregar mesero»: escriba su nombre, un correo inventado (ej: mesero3@[DOMINIO_CORREO]) y una clave (puede generarla). Al crearla, anote los datos y entrégueselos. También puede cambiar una clave que se olvidó, cambiar el nombre o quitar el acceso de alguien que ya no trabaja aquí.`,`personal`],[`.a-vid`,`Video de bienvenida`,`Suba un video corto de [NOMBRE_RESTAURANTE]: la cocina, el local, el equipo. Sale en la portada con el botón «Conozca [NOMBRE_RESTAURANTE]».`,`ajustes`],[`.a-liberar`,`Liberar la mesa`,`Cuando el mesero envía la cuenta, la mesa se libera sola pasados estos minutos: los celulares de la familia que se fue se despiden y la mesa queda lista para la siguiente. Aquí cambia cuántos minutos.`,`ajustes`],[`.a-wa`,`Pedidos por WhatsApp`,`Aquí prende o apaga los pedidos a domicilio y para llevar. Escriba el número de WhatsApp del restaurante, el costo del domicilio (0 = gratis) y el mensaje que verá el cliente cuando esté apagado. Abajo está el link /pedir para compartir en redes: copie el link o descargue su QR. El cliente arma su pedido en la misma carta y se lo envía a este WhatsApp ya escrito.`,`ajustes`],[`[data-ad=ver]`,`Ve
