/* ¿Está en su horario la programación de «Noche en la terraza»? (copia corta de enHorario() de src/compartido/ediciones.js; el código de verdad lo confirma al cargar) */

  }
  return false
}
try {
  var ed = JSON.parse(localStorage.getItem('carta:ed-cache') || 'null')

} catch (e) {}

try {

arla.`,`ediciones`],[`.ed-noche`,`Ambiente de la carta Normal`,`Debajo de la edición «Normal» está su ambiente animado, «Noche en la terraza»: desde las 6 p.m. la carta pasa a una paleta oscura y cálida, con guirnaldas de bombillos, luciérnagas, vapor en los platos calientes y un resplandor en las tarjetas; de día vuelve a los colores de Apariencia. Escoja la intensidad (Apagado, Suave, Media o Fuerte) y deje prendido «Ambiente de noche automático desde las 6 p.m.». «Ver de noche» le deja verlo ahora mismo.`,`ediciones`],[`.a-colores`,`Colores de la carta`,`Cambie los colores de la carta Normal: fondo, tarjetas, color principal (botones y barra de categorías), acento (precios y detalles) y texto. Escoja una paleta ya armada con un toque, o cada color con el selector. Abajo ve la carta en miniatura antes de guardar. Si con esos colores algo no se lee bien, se lo avisa y no deja guardar. «Volver a los colores originales» deja los de siempre. Las ediciones de temporada siguen con sus propios colores.`,`apariencia`],[`.a-imgs`,`Imágenes de la carta`,`Aquí están todas las imágenes que NO son de comida: el logo (acepta PNG con fondo transparente), la foto de la portada, y el fondo de la animación de bienvenida (la foto de «Arma tu pizza» está en Platos → Pizzas y las de cada categoría en la pestaña Categorías). Cada una con vista previa, «Cambiar» y «Volver a la original». Se reducen de tamaño solas antes de guardarse.`,`apariencia`],[`.a-mesas`,`Mesas`,`Ponga un nombre a una mesa (ej: Terraza), desactívela o agregue una nueva. El QR de cada mesa es fijo: no cambia nunca.`,`mesas`],[`.a-qr-todos`,`Los QR de las mesas`,`«Ver QR» (en cada mesa) muestra su QR: puede descargarlo como imagen o imprimirlo. «Imprimir todos los QR» abre hojas tamaño carta con 6 QR cada una, el logo, «Mesa X» y líneas para recortar. El QR de cada mesa es siempre el mismo y usa la dirección de este sitio.`,`mesas`],[`.a-cats`,`Categorías`,`Aquí cambia el nombre de una categoría o crea una nueva, po
